version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: procurement_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: procurement
    # Removed ports mapping to avoid conflicts on host port 5432. It remains accessible internally on the Docker network.
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: procurement_backend
    restart: always
    ports:
      - "8050:8000" # Mapped to host port 8050 to avoid collisions
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/procurement
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_DOC_INTEL_KEY=${AZURE_DOC_INTEL_KEY}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: procurement_frontend
    restart: always
    ports:
      - "5183:1928" # Mapped to host port 5183 to avoid collisions
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
