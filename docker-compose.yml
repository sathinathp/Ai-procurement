version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: procurement_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: procurement
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: procurement_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/procurement
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_DOC_INTEL_KEY=${AZURE_DOC_INTEL_KEY}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: procurement_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
